name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Stage allowlisted site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir pages-dist
          cp index.html pages-dist/
          for directory in \
            abyss-protocol comet-dash crimson-command neon-fury neon-stack \
            nova-breaker orbit-drift singularity star-serpent starfall-squadron \
            voxel-frontier; do
            cp -R "$directory" pages-dist/
          done
          mkdir pages-dist/terrarium
          cp terrarium/index.html pages-dist/terrarium/
          mkdir pages-dist/westworld
          cp westworld/index.html pages-dist/westworld/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
